[package]
name = "pricelevel"
version = "0.10.0"
edition = "2024"
authors = ["Joaquin Bejar <jb@taunais.com>"]
description = "A price level implementation for limit order books in Rust, built on a lock-free ordered index and atomic counters. Provides the building blocks for trading systems, with multiple order types and concurrent admissions, updates and reads alongside one matcher per level."
license = "MIT"
readme = "README.md"
repository = "https://github.com/joaquinbejar/PriceLevel"
homepage = "https://github.com/joaquinbejar/PriceLevel"
keywords = ["finance", "orderbook", "trading"]
categories = ["finance", "data-structures"]


include = [
    "benches/**/*",
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Makefile",
    "rust-toolchain.toml",
    "Draws/**/*.png",
    "Docker/**/*.Dockerfile",
    "Docker/**/*.yml",
]

[lints.rust]
# `loom` is a model-checker config flag set only by
# `RUSTFLAGS="--cfg loom" cargo test` for the #81 linearization model
# (`tests/loom/cancel_match.rs`); register it so the unexpected-cfg lint stays
# quiet under `-D warnings` for normal builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

# Production Panic Policy gate (issue #173). This table is package-wide: it
# applies to every target of THIS package (`src/lib.rs`, the `tests`,
# `proptest`, `loom_*` integration-test binaries, and the `benches` /
# `latency` bench binaries), not to the separate `examples` workspace member.
#
# `clippy.toml` (`allow-unwrap-in-tests` / `allow-expect-in-tests` /
# `allow-panic-in-tests` / `allow-indexing-slicing-in-tests`) narrows
# `unwrap_used`, `expect_used`, `panic`, `indexing_slicing` and `string_slice`
# so clippy's own `#[cfg(test)]` / `#[test]` detection exempts real test items
# (co-located `mod tests { ... }` blocks under `src/<module>/tests/`, and the
# `tests/unit`, `tests/proptest`, `tests/loom_*` integration targets, which
# compile with `cfg(test)` as a whole). It does NOT exempt a standalone
# `#[cfg(test)] fn` production helper that lives outside a `mod tests {}`
# block — clippy's heuristic is per-item, not per-block, so those keep the
# deny. `scripts/check_panic_policy.py` is the second layer that catches what
# clippy has no lint for at all (`assert!`/`debug_assert!` families) and
# re-checks the forms clippy's `#[cfg(test)]` heuristic can still wrongly
# wave through on a standalone helper (see the script header).
#
# Bench (`benches/mod.rs`, `benches/latency/main.rs`) and integration-test
# crate roots (`tests/unit/mod.rs`, `tests/proptest/mod.rs`,
# `tests/loom/*.rs`) carry their own crate-level `#![allow(...)]` for the
# lints without a `clippy.toml` "in tests" toggle (`arithmetic_side_effects`,
# `cast_possible_truncation`, `cast_sign_loss`, `cast_possible_wrap`,
# `manual_assert`, `panic_in_result_fn`, `get_unwrap`, `exit`, `unreachable`,
# `todo`, `unimplemented`) — see each file's header comment. The policy is
# production-only; it deliberately does not restrict test or bench code.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
manual_assert = "deny"
panic_in_result_fn = "deny"
get_unwrap = "deny"
exit = "deny"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
crossbeam-skiplist = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
ulid = { workspace = true, features = ["serde"] }
dashmap = { workspace = true }
sha2 = { workspace = true }
# `AtomicU128` for the widened `value_executed` statistics accumulator (issue
# #140): `std`'s `AtomicU128` is not stable. Default features (`fallback`)
# keep the type available on every target; it is lock-free where the CPU has a
# native 128-bit CAS (see `PriceLevelStatistics` docs).
portable-atomic = { workspace = true }


[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["html_reports"] }
# proptest is dev-only: it drives the property-test harness in
# `tests/proptest/mod.rs` (issue #80) and never ships in the library surface.
# `default-features = false` drops the `fork`/`timeout` machinery (and its
# `rusty-fork` / `wait-timeout` deps) we do not use; `std` keeps the core
# strategy API.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# bincode is dev-only: it pins the non-self-describing serde round-trip of
# `MatchResult` (issue #135) — the shape downstream consumers (OrderBook-rs's
# NATS bincode path) encode with. It never ships in the library surface.
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }
# loom is a dev-only model checker, gated behind `--cfg loom`. It is NOT a
# runtime dependency. It models the cancel-vs-partial-fill linearization (issue
# #81; `tests/loom/cancel_match.rs`) and the single-writer statistics seqlock
# (issue #153; `tests/loom/stats_seqlock.rs`). loom cannot instrument dashmap /
# crossbeam-skiplist (they are not loom-aware), so the loom test models the
# per-entry-lock PROTOCOL with loom's own primitives rather than the real queue.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[[test]]
name = "loom_cancel_match"
path = "tests/loom/cancel_match.rs"

[[test]]
name = "loom_stats_seqlock"
path = "tests/loom/stats_seqlock.rs"

[[test]]
name = "tests"
path = "tests/unit/mod.rs"

[[test]]
name = "proptest"
path = "tests/proptest/mod.rs"

[[bench]]
name = "benches"
path = "benches/mod.rs"
harness = false

# Isolated operation / tail-latency harness (issue #142). Deliberately a
# SEPARATE bench target from "benches" above: `harness = false` here too, but
# this binary owns its own `#[global_allocator]` (see `benches/latency/alloc.rs`)
# and its own per-operation timing loop, neither of which belong in — or
# should slow down — the Criterion suite. Run with `make bench-latency` /
# `cargo bench --bench latency`.
[[bench]]
name = "latency"
path = "benches/latency/main.rs"
harness = false

[lib]
name = "pricelevel"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[workspace]
members = [
    "examples"
]

[workspace.dependencies]
pricelevel = { path = "." }
tracing = "0.1"
tracing-subscriber = { version = "0.3" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
crossbeam-skiplist = "0.1"
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
ulid = { version = "3.0", features = ["serde"] }
dashmap = "6.2"
sha2 = "0.11"
portable-atomic = "1.15"
